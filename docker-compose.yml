version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: travelwithme-db
    restart: always
    environment:
      POSTGRES_DB: travelwithme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/travelwithme_database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travelwithme"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
